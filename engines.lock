# Vendored engines: which commit each copy came from.
#
# This repository carries copies of six repositories.  Each copy is taken at a
# fixed commit so that a checkout builds the same thing twice, and so that
# "which version is this?" has an answer.
#
# Every entry was built here before it was pinned.  Bump one deliberately:
#
#     ./scripts/sync-engines.sh --bump artemis
#     ./build-all.sh && ./build-all.sh --check --data <dir>
#     git add -A && git commit        # lock file and engine copy move together
#
# format: <name> <directory> <commit> <source repository> [note]
#
# The source repository column is what sync-engines.sh reads; paths beginning
# with ~ are resolved against $HOME.

