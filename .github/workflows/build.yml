name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Apple Silicon runner: these ports are arm64-only.
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake scons sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl3 \
                       sdl12-compat lua jpeg-turbo libpng lz4 ffmpeg bzip2 boost \
                       gettext libogg libvorbis libsndfile libarchive opencv@4
          echo "--- versions ---"
          cmake --version | head -1
          scons --version | head -2
          echo "brew prefix: $(brew --prefix)"

      # One step per engine, so a failure lands in its own log rather than in a
      # combined one, and its compiler output is visible without digging.
      - name: Build nscripter (OnscripterYuri)
        run: |
          cd OnscripterYuri
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Build bgi (OpenBGI)
        run: make -C openbgi/openbgi-src PLATFORM=darwin -j2

      - name: Build kirikiri (Kirikiroid2)
        run: |
          cd kirikiroid2-mac
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Build artemis (from scratch)
        run: |
          cd artemis
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Build reallive (RLVM)
        run: |
          cd rlvm
          # --no-bundle: Xcode 15's install_name_tool cannot rewrite a signed
          # Homebrew dylib, so the .app packaging step is left to a newer host.
          scons --release --no-bundle -j2

      - name: Checks that need no game data
        # Everything else needs a game the repository deliberately does not ship
        # (docs/DATA.md).  These two exercise real code paths on their own:
        # 260 RLVM unit tests, and Artemis's pfs/ast/runtime layers.
        run: |
          ./build-all.sh --check --skip nscripter --skip kirikiri --skip bgi

      - name: Artifacts exist
        run: |
          set -e
          for f in OnscripterYuri/build/onsyuri \
                   openbgi/openbgi-src/bin/bgi \
                   kirikiroid2-mac/build/krkrrun \
                   artemis/build/agame \
                   rlvm/build/release/rlvm-static; do
            test -x "$f" || { echo "missing: $f"; exit 1; }
            printf '%-52s %s\n' "$f" "$(file -b "$f" | cut -d, -f1)"
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          for f in /tmp/gal_build_*.log /tmp/gal_*.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -80 "$f"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/gal_build_*.log
            /tmp/gal_*.log
          if-no-files-found: ignore
          retention-days: 7
